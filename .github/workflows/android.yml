name: Android APK and Release
on:
  push:
    branches: [scratch-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-in-one-media-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/all-in-one-media-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/all-in-one-media-release.jks" >> "$GITHUB_ENV"
            gradle --no-daemon :app:assembleRelease
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signing_mode=stable-release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Stable signing secrets are not configured. This APK uses a temporary runner debug key; future CI builds will not be update-compatible until stable signing is configured."
            gradle --no-daemon :app:assembleDebug
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "signing_mode=temporary-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare direct APK
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          mkdir -p dist
          cp "$APK_PATH" dist/All-IN-ONE-Media.apk
          sha256sum dist/All-IN-ONE-Media.apk

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/scratch-rebuild'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.3-build-${{ github.run_number }}
          name: All IN ONE Media v0.3.3 (build ${{ github.run_number }})
          body: |
            All IN ONE Media v0.3.3.
            Provider parsing now accepts nested and JSON-encoded feeds, string entries and string page lists. The interface uses translucent glass panels and ambient gradient lighting.
            This build uses a fresh application ID so it can install alongside older builds signed with an unrecoverable temporary CI key.
            Signing mode: ${{ steps.build.outputs.signing_mode }}.
            Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository Actions secrets to make future updates install over this version.
          files: dist/All-IN-ONE-Media.apk
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-IN-ONE-Media-v0.3.3-APK
          path: dist/All-IN-ONE-Media.apk
          if-no-files-found: error
