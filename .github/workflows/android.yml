name: Android APK and Release
on:
  push:
    branches: [scratch-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-in-one-media-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/all-in-one-media-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/all-in-one-media-release.jks" >> "$GITHUB_ENV"
            gradle --no-daemon :app:assembleRelease
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signing_mode=stable-release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Stable signing secrets are not configured. This APK uses a temporary runner debug key; future CI builds will not be update-compatible until stable signing is configured."
            gradle --no-daemon :app:assembleRelease
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signing_mode=temporary-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK package and signature
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | head -n 8

      - name: Prepare direct APK
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          mkdir -p dist
          cp "$APK_PATH" dist/All-IN-ONE-Media.apk
          sha256sum dist/All-IN-ONE-Media.apk

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/scratch-rebuild'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-build-${{ github.run_number }}
          name: All IN ONE Media v0.5.0 (build ${{ github.run_number }})
          body: |
            All IN ONE Media v0.5.0.
            Adds a Stremio HTTP add-on client: detects manifest.json URLs, syncs catalogues, searches add-ons that declare the search extra, fetches metadata and episodes, requests stream options, and plays direct HTTPS streams.
            The app still does not execute Mihon/Komikku or Aniyomi APK extensions, CloudStream scripts, LNReader/Mangayomi packages, torrent/magnet streams, DRM or arbitrary external protocols. Those need separate compatible runtimes.
            Application ID: com.allinonemedia.app.v050. This is a separate install from earlier builds because the CI signing key is temporary unless a stable keystore is configured.
            Signing mode: ${{ steps.build.outputs.signing_mode }}.
            Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository Actions secrets for stable in-place updates in future releases.
          files: dist/All-IN-ONE-Media.apk
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-IN-ONE-Media-v0.5.0-APK
          path: dist/All-IN-ONE-Media.apk
          if-no-files-found: error
