name: Android APK
on:
  push:
    branches: [scratch-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses && sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: All-IN-ONE-Media-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
