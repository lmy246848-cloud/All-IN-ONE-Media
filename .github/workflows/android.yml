name: Android APK and Release
on:
  push:
    branches: [scratch-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare direct APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/All-IN-ONE-Media.apk
          sha256sum app/build/outputs/apk/debug/All-IN-ONE-Media.apk

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/scratch-rebuild'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          name: All IN ONE Media v0.2.0 (build ${{ github.run_number }})
          body: |
            All IN ONE Media Android build.
            This is a debug-signed test APK. Install on Android 8.0 or newer.
            Review the project README and provider format before adding sources.
          files: app/build/outputs/apk/debug/All-IN-ONE-Media.apk
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-IN-ONE-Media-debug-APK
          path: app/build/outputs/apk/debug/All-IN-ONE-Media.apk
          if-no-files-found: error
